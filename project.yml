name: SorryGains
options:
  bundleIdPrefix: com.sorrygains
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "7"
    GENERATE_INFOPLIST_FILE: true
    SWIFT_EMIT_LOC_STRINGS: true
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: "992BWJ82JX"
    CODE_SIGN_STYLE: Automatic

targets:
  SorryGains:
    type: application
    platform: iOS
    sources:
      - path: SorryGains
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        INFOPLIST_FILE: SorryGains/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: "筋肉ごめん"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SorryGains/SorryGains.entitlements
    postBuildScripts:
      - name: Generate dSYMs for Google Ads framework stubs
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          DSYM_DIR="${DWARF_DSYM_FOLDER_PATH}"

          for framework in GoogleMobileAds UserMessagingPlatform; do
            binary="${FRAMEWORKS_DIR}/${framework}.framework/${framework}"
            output="${DSYM_DIR}/${framework}.framework.dSYM"

            if [[ -f "${binary}" && ! -d "${output}" ]]; then
              mkdir -p "${DSYM_DIR}"
              xcrun dsymutil "${binary}" -o "${output}" || true
            fi
          done
    scheme:
      testTargets:
        - SorryGainsTests
        - SorryGainsUITests
      # StoreKit Test Configuration: Simulator での購入フロー自動テスト用
      storeKitConfiguration: SorryGains/SorryGains.storekit

  SorryGainsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SorryGainsTests
    dependencies:
      - target: SorryGains
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SorryGains.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SorryGains"

  SorryGainsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SorryGainsUITests
    dependencies:
      - target: SorryGains
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SorryGains
